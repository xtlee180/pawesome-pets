<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Caveat&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
    <link th:href="@{signUp.css}" rel="stylesheet" />
    <title>Sign up page</title>
</head>

<body>
    <div class="v16_82">

        <!--Nav bar stuff-->
        <div th:replace="navbar:: navbar">
        <div class="v16_503"></div>
        <span class="v16_85">Pawsome Pets</span>
        <div class="v16_86">
            <span class="v16_87">Home</span>
            <span class="v16_88">About Us</span>
            <span class="v16_89">Contact Us</span>
            <span class="v16_90">Adopt me?</span>
        </div>
            <!-- <span class="v16_91">SignIn</span> -->

        <!--Paw prints-->
        <div class="v16_92"></div>
        <div class="v16_93"></div>

        <a class="v16_94 nav" href="#">Sign in</a>
        <!-- <div class="v16_94"></div>
        <span class="v16_95">Sign In</span> -->
</div>

        <div class="v16_109"></div>
        <span class="v16_111">Sign Up</span>

        <!--input here so form-->
        <form action="#" th:action="@{/addUser}" th:object="${newUser}" method="post">
            <input type="text" class="v16_114 infoText" placeholder="First Name" th:field="*{firstName}"></input>
            <input class="v16_136 infoText" type="text" placeholder="Last Name" th:field="*{lastName}"></input>
            <input class="v16_137 infoText" type="text" placeholder="Email Address" th:field="*{email}"></input>
            <input class="v16_138 infoText" type="text" placeholder="Phone Number" th:field="*{phoneNumber}"></input>
            <input class="v16_139 infoText" type="text" placeholder="UserName" th:field="*{userName}"></input>
            <input class="v16_140 infoText" type="text" placeholder="Password" th:field="*{userPassword}"></input> 
            <input class="v16_141 infoText" type="text" placeholder="Confirm Password" th:field="*{confirmPassword}"></input>
            <!--form button-->
            <button class="v16_296 infoText" type="submit">Create</button>
            <!-- <span class="v16_462">Create</span> -->
        
        </form>
        <!--avatar selection if possible-->
        <div class="v16_546"></div>
       
    </div>
    
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>

</html>
