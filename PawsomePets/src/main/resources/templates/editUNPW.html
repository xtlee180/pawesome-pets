<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link th:href="@{editUNPW.css}" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <div class="v106_68">
        
        <div th:replace="navbar:: navbar"></div>
        <div class="v106_69"></div>
        <div class="v106_70"></div>
        
        <div th:if="${!errors.isEmpty()}"><p class="alert alert-danger" th:each="error : ${errors}"
               th:text="${error.message}"></p></div>
        
        <form action="#" th:action="@{/editUNPW}" th:object="${userEdit}" method="post">
        	<input type="hidden" th:field="*{userID}"></input>
        	<input type="hidden" th:field="*{firstName}"></input>
        	<input type="hidden" th:field="*{lastName}"></input>
        	<input type="hidden" th:field="*{userType}"></input>
        	<input type="hidden" th:field="*{email}"></input>
        	<input type="hidden" th:field="*{phoneNumber}"></input>
            <input class="v106_71" type="text" th:field="*{userName}"></input>
            <input class="v106_72" type="text" th:field="*{userPassword}"></input>
            <input class="v106_73" type="text" th:field="*{confirmPassword}"></input>
            <span class="v106_76">Edit Credentials</span>
            <span class="v106_77">Username:</span>
            <span class="v106_78">Password:</span>
            <span class="v106_79">Confirm Password:</span>

            <a class="v106_82 buttonText" href="/profile">Cancel</a>
            <button class="v106_81 buttonText" type="submit">Edit</button>


        </form>
        
    </div>
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>

</html>
