<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Caveat&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
    <link th:href="@{editAnimal.css}" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <div class="v16_1100">
    
    <div th:replace="navbar:: navbar">
    <span class="v16_1102">Pawsome Pets</span>
        <div class="v16_1103"><span class="v16_1104">Home</span><span class="v16_1105">About Us</span><span
                class="v16_1106">Contact Us</span><span class="v16_1107">Adopt me?</span></div><span
            class="v16_1108">Sign In</span>
        <div class="v16_1109"></div>
        <div class="v16_1110"></div><span class="v16_1111">Sign In</span>
        <div class="v16_1112"></div>
        <div class="v16_1113"></div>
        <div class="v16_1114"></div>
        <div class="v16_1115"></div>
        <span class="v16_1116">Admin</span>
</div>

        <!--buttons-->
        <a class="v16_1138 buttonText" href="./addAnimalInput">Add Animal</a>
        <a class="v16_1139 buttonText" href="./deleteAnimalInput">Delete Animal</a>
        <a class="v16_1140 buttonText" href="./editAnimalInput">Edit Animal</a>


        <!--edit box background-->
        <div class="v16_1646"></div>
        <div class="v16_1651"></div>

    <form action="#" th:action="@{/editAnimalNow}" th:object="${editAnimal}" method="post">
   			<input type="hidden" th:field="*{petID}">
            <input class="v16_1652 placeText" th:field="*{petName}">
            <input class="v16_1653 placeText" th:field="*{description}">
            <input class="v16_1654 placeText" th:field="*{age}">
            
            <select class="v16_1655 placeText" th:field="*{size}">
            	<option th:each="size: ${sizeList}" th:value="${size}" th:text=${size}></option>
            </select>
            <input class="v16_1656 placeText" th:field="*{type}">
            <input class="v16_1657 placeText" th:field="*{image?}">
            
            <select class="v16_1658 placeText" th:field="*{availability}">
            	<option th:each="ava: ${avaList}" th:value="${ava}" th:text=${ava}></option>
            </select>
            <input class="v16_1659 placeText" th:field="*{breed}">
   
			<select class="v16_1660 placeText" th:field="*{gender}">
            	<option th:each="gender: ${genderList}" th:value="${gender}" th:text=${gender}></option>
            </select>
			
			
			
            <button class="v16_1670 editText" type="submit">Edit</button>

        </form>

    </div>
    
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>

</html>
