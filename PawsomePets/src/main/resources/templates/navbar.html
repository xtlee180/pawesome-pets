<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NavigationBar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" th:href="home.css">

</head>
<body>

    <nav class="navbar bg-body-tertiary navbar-expand-lg" th:fragment="navbar">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
            </button>
          
        
          <div class="collapse navbar-collapse d-lg-flex" id="navbarNav">
            <a class="navbar-brand col-lg-3 me-0" href="#">
                <img th:src="@{Pawesome_Pets.png}" alt="Bootstrap" width="250" height="auto">
              </a>
            <ul class="navbar-nav  col-lg-6 justify-content-lg-evenly">
                <li class="nav-item">
                    <a class="nav-link" href="#" th:src="@{/}" th:class="${currentPage == 'home' ? 'active' : ''}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" th:src="@{/pets}" th:class="${currentPage == 'pets' ? 'active' : ''}">Adopt Me?</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" th:src="@{/aboutus}" th:class="${currentPage == 'aboutus' ? 'active' : ''}">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" th:src="@{/contact}" th:class="${currentPage == 'contact' ? 'active' : ''}">Contact Us</a>
                </li>
            </ul>

            <div class="col-lg-3">
            <div th:if="${session.sessionUser == null}">
        		<a class = "btn btn-primary" href="./login">Sign In</a>
        	</div>
        	
        	<div th:if="${session.sessionUser != null}">
	        	<div class= "dropdown">
	        		<button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
	        			<span th:text="${session.sessionUser.userName}"></span>
	        		</button>
	        	
	        	<ul class="dropdown-menu">
	        		<li><a class="dropdown-item" href="#" th:src="@{/userProfile}">Profile</a></li>
	        		<li><a class="dropdown-item" href="#" th:src="@{/wishlist}">Wishlist</a></li>
	        		<li><a class="dropdown-item" href="#" th:src="@{/applications}">Applications</a></li>
	        		<li><a th:if="${session.sessionUser.userType.toString() == 'ADMIN'}" class="dropdown-item" href="#" th:src="@{/admin}">Admin</a></li>
	        		<li><hr class = "dropdown-divider"></hr>
	        		<li><a class="dropdown-item" href="./logout">Logout</a></li>
	        	</ul>
	        	</div> 
            </div>
          </div>
        </div>
      </nav>


      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>

</html>
