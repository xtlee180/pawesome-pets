<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NavigationBar</title>
    <link rel="stylesheet" th:href="home.css">

</head>
<body>
<!--add to html files to reuse html code-->
<!--<div th:replace="navbar:: header"></div>-->
<!--<div th:replace="navbar:: navbar"></div>-->
<div class="container-fluid">
    <nav th:fragment="navbar" class="navbar col-md-6 col-12 text-center">
        <!-- need to add logo on far left-->
        <div class="logo-container">
            <img class="paw1" src="./images/paw.png" alt="paw">
            <p>Pawsome Pets</p>
            <img class="paw2" src="./images/paw.png" alt="paw">
        </div>
        <ul class="nav-container">
            <li class="nav-item">
                <a class="nav-link" href="#" th:src="@{/}" th:class="${currentPage == 'home' ? 'active' : ''}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" th:src="@{/pets}" th:class="${currentPage == 'pets' ? 'active' : ''}">Adopt Me?</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" th:src="@{/aboutus}" th:class="${currentPage == 'aboutus' ? 'active' : ''}">About Us</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" th:src="@{/contact}" th:class="${currentPage == 'contact' ? 'active' : ''}">Contact Us</a>
            </li>
        </ul>
        <div th:if="${sessionUser == null}">
        	<a class = "btn btn-primary" href="#" th:src="@{/login}">Sign In</a>
        </div>
        <div th:if="${sessionUser != null}">
        	<div class= "dropdown">
        		<button class="btn btn-secondary dropdown-toggle" type="button" id="userDropdown" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        			<span th:text="${sessionUser.userName}"></span>
        		</button>
        	</div>
        	<div class="dropdown-menu" aria-labelledby="userDropdown">
        		<a class="dropdown-item" href="#" th:src="@{/userProfile}">Profile</a>
        		<a class="dropdown-item" href="#" th:src="@{/wishlist}">Wishlist</a>
        		<a class="dropdown-item" href="#" th:src="@{/applications}">Applications</a>
        		<a th:if="${sessionUser.userType == T(com.pawsomepets.dto.UserType).ADMIN}" class="dropdown-item" href="#" th:src="@{/admin}">Admin</a>
        		<div class = "dropdown-divider"></div>
        		<a class="dropdown-item" href="#" th:src="@{/logout}">Logout</a>
        	</div>
        </div>
        
    </nav>
</div>
</body>
</html>
