<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Caveat&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
    <link th:href="@{login.css}" rel="stylesheet" />
    <title>Login Page</title>
</head>

<body>
    <!--Nav bar stuff-->
    <div class="v10_5">
    <div th:replace="navbar:: navbar">
        <span class="v16_4">Pawsome Pets</span>
        <div class="v16_5">
            <a class="v16_6 nav" href="#">Home</a>
            <a class="v16_7 nav" href="#">About Us</a>
            <a class="v16_8 nav" href="#">Contact Us</a>
            <a class="v16_9 nav" href="#">Adopt me?</a>
        </div>
     
            <!-- <a class="v16_10" href="#">Sign In</a> -->
            
        <!--Paw prints in logo-->
        <div class="v16_11"></div>
        <div class="v16_12"></div>
        <!--Sign in button-->
        <a class="v16_13 nav" href="#">Sign in</a>
	</div>
        <!--Boxes behind login form-->
        <div class="v16_41"></div>
        <div class="v16_18"></div>

        <!--Login form-->
        <form action="#" th:action="@{/loginUser}" th:object="${login}" method="post">
            <input class="v16_70" type="text" th:field="*{userName}"></input>
            <input class="v16_72" type="password" th:field="*{userPassword}"></input>
            <span class="v16_73">Username</span>
            <span class="v16_74">Password</span>

            <button class="v16_75" type="submit">Login</button>
        </form>

        <!--Sign up -->
        <span class="v16_78">No account? Sign up <a href="#">here</a> </span>

        <!--Title-->
        <span class="v16_42">Login</span>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>

</html>
