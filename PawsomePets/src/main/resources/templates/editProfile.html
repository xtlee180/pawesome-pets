<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link th:href="@{editProfile.css}" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <div class="v106_13">
		<div th:replace="navbar:: navbar"></div>

        <div class="v106_14"></div>
        <div class="v106_28"></div>
        
        <div th:if="${!errors.isEmpty()}"><p class="alert alert-danger" th:each="error : ${errors}"
               th:text="${error.message}"></p></div>
        

        <form action="#" th:action="@{/editProfile}" th:object="${userEdit}" method="post">
        	<input type="hidden" th:field="*{userID}"></input>
        	<input type="hidden" th:field="*{userName}"></input>
        	<input type="hidden" th:field="*{userPassword}"></input>
        	<input type="hidden" th:field="*{userType}"></input>
            <input class="v106_30" type="text" th:field="*{firstName}"></input>
            <input class="v106_32" type="text" th:field="*{lastName}"></input>
            <input class="v106_34" type="text" th:field="*{email}"></input>
            <input class="v106_36" type="text" th:field="*{phoneNumber}"></input>
            <span class="v106_58">Edit Profile</span>
            <span class="v106_59">First name:</span>
            <span class="v106_61">Last name:</span>
            <span class="v106_62">Email :</span>
            <span class="v106_63">Phone No. :</span>

            <button class="v106_64 buttonText" type="submit">Edit</button>
            <a class="v106_65 buttonText cancelButton" href="/profile">Cancel</a>
            

        </form>
    </div>
    
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>

</html>
