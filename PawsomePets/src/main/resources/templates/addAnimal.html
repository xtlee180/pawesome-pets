<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css?family=Caveat&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
    <link th:href="@{addAnimal.css}" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <div class="v16_959">

        <!--navbar-->
        <div th:replace="navbar:: navbar">
        <div class="v16_1054"></div><span class="v16_961">Pawsome Pets</span>
        <div class="v16_962"><span class="v16_963">Home</span><span class="v16_964">About Us</span><span
                class="v16_965">Contact Us</span><span class="v16_966">Adopt me?</span></div><span class="v16_967">Sign
            In</span>
        <div class="v16_968"></div>
       </div>
       
       <!--  
        <div class="v16_971"></div>
        <div class="v16_972"></div>
        <div class="v16_973"></div>
        <div class="v16_974"></div><span class="v16_975">Admin</span>
    
        <div class="v16_991"></div>
        <div class="v16_992"></div><span class="v16_993">Sign In</span>
        <div class="v16_994"></div>
        <div class="v16_995"></div>
        <div class="v16_996"></div>
        <div class="v16_997"></div><span class="v16_998">Admin</span>-->
        
        <!--buttons-->
        <a class="v16_999 buttonText" href="#">Add Animal</a>
        <a class="v16_1000 buttonText" href="#">Delete Animal</a>
        <a class="v16_1001 buttonText" href="#">Edit Animal</a>

        
        
        <!--cream box-->
        <div class="v16_1006"></div>
        
        <form action="#" th:action="@{/addAnimal}" th:object="${addAnimal}" method="post">
        	<input type="hidden" th:field="*{petID}"> </input>
            <input class="v16_1260 infoText" type="text" placeholder="Name" th:field="*{petName}"></input>
            <input class="v16_1265 infoText" type="text" placeholder="Description" th:field="*{description}"></input>
            <input class="v16_1261 infoText" type="text" placeholder="Age" th:field="*{age}"></input>
            <input class="v16_1293 infoText" type="text" placeholder="Breed" th:field="*{breed}"></input>
            
            <select class="v16_1351 infoText" th:field="*{size}">
            	<option th:each="size: ${sizeList}" th:value="${size}" th:text=${size}></option>
            </select>
            
            <!-- may need to do a bit of editing with this to get the image stuff to work -->
            <input class="v16_1642 upload" type="file"></input>
            <select class="v16_1464 infoText" th:field="*{availability}">
            	<option th:each="ava: ${avaList}" th:value="${ava}" th:text=${ava}></option>
            </select>
            <input class="v16_1294 infoText" type="text" placeholder="Type" th:field="*{type}"></input>
            
            <select class="v16_1263 infoText" th:field="*{gender}">
            	<option th:each="gender: ${genderList}" th:value="${gender}" th:text=${gender}></option>
            </select>

            <!--add button-->
            <button class="v16_1644 infoText" type="submit"> Add</button>


        </form>

    </div>
    
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>

</html>
