<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!--Fonts-->
    <link href="https://fonts.googleapis.com/css?family=Caveat&display=swap" rel="stylesheet" />
	<link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <link href="https://fonts.googleapis.com/css?family=Caveat&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{pets.css}" />
    <title>Shelter Residents</title>
</head>
<body>
    <div th:replace="navbar:: navbar"></div> <!--thymeleaf nav bar-->
    <div class="container-fluid" id="petCards">
        <table style="width: auto;">
            <tr th:each="pet : ${pets}">
                <div class="card" style="width: 377px;">
                    <img th:src="${pet.image}" class="card-img-top" th:alt="${pet.type}">
                    <div class="card-body">
                        <p class="card-body" th:text="${pet.name}"></p>
                        <a th:href="@{/petinfo/${pet.petID}}" class="btn btn-primary">More Information</a>
                    </div>
                </div>
            </tr>
        </table>

        <div th:if="${not petsMainPage.first}">
            <a

        </div>


    </div>


    <!-- Bootstrap scripts-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
